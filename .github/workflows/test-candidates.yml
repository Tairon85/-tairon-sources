name: Test Tairon Candidates (no live changes)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Test candidates without modifying live sources
        run: python scripts/test_candidate_sources.py
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: tairon-candidate-results
          path: candidate_test_results.json
