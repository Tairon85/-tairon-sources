name: Update Tairon Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check and update provider domains
        run: python scripts/update_sources.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi

          git config user.name "tairon-source-bot"
          git config user.email "actions@users.noreply.github.com"

          git add tairon_sources.txt providers.json
          git commit -m "Auto-update Tairon sources"
          git push
